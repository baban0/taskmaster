<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaskMaster | Task Manager</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f1f5f9;color:#172033}
header{background:#123c35;color:white;padding:25px 18px;text-align:center}
header h1{margin:0 0 8px}
main{max-width:850px;margin:25px auto;padding:16px}
.card{background:white;padding:20px;border-radius:14px;margin-bottom:18px;box-shadow:0 4px 15px #0000000b}
input,textarea,select,button{font:inherit;padding:12px;border-radius:8px;border:1px solid #cbd5e1;width:100%;margin:6px 0}
textarea{resize:vertical}
button{background:#13795b;color:white;border:0;font-weight:bold;cursor:pointer}
button:hover{background:#0c5d45}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{flex:1;min-width:100px;background:#e5f4ed;padding:14px;border-radius:10px;text-align:center}
.task{border:1px solid #e2e8f0;padding:14px;border-radius:10px;margin:12px 0}
.task h3{margin:4px 0 8px}
.task p{overflow-wrap:anywhere}
.done h3{text-decoration:line-through;color:#64748b}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions button{width:auto;flex:1}
.delete{background:#b42318}
small{color:#64748b}
footer{text-align:center;color:#64748b;padding:20px}
</style>
</head>
<body>
<header>
<h1>TaskMaster</h1>
<p>Plan your day. Track your progress. Get things done.</p>
</header>
<main>
<section class="card">
<h2>My Dashboard</h2>
<div class="stats">
<div class="stat"><strong id="total">0</strong><br>Total</div>
<div class="stat"><strong id="pending">0</strong><br>Pending</div>
<div class="stat"><strong id="completed">0</strong><br>Completed</div>
</div>
</section>

<section class="card">
<h2 id="formTitle">Add a New Task</h2>
<form id="taskForm">
<input id="title" placeholder="Task title" required maxlength="100">
<textarea id="description" placeholder="Task description (optional)" rows="3"></textarea>
<label for="dueDate">Due date</label>
<input id="dueDate" type="date">
<label for="priority">Priority</label>
<select id="priority">
<option value="Normal">Normal</option>
<option value="High">High</option>
<option value="Low">Low</option>
</select>
<button type="submit" id="saveBtn">Add Task</button>
<button type="button" id="cancelBtn" hidden>Cancel Edit</button>
</form>
</section>

<section class="card">
<h2>My Tasks</h2>
<input id="search" placeholder="Search tasks...">
<select id="filter">
<option value="all">All tasks</option>
<option value="pending">Pending tasks</option>
<option value="completed">Completed tasks</option>
</select>
<div id="taskList"></div>
</section>
</main>
<footer>TaskMaster — Stay organized, achieve more.</footer>

<script>
const $ = id => document.getElementById(id);
let tasks = [];
let editingId = null;

try {
  const saved = JSON.parse(localStorage.getItem("taskmaster-tasks") || "[]");
  if (Array.isArray(saved)) tasks = saved;
} catch (e) {
  tasks = [];
}

function save() {
  localStorage.setItem("taskmaster-tasks", JSON.stringify(tasks));
  render();
}

function resetForm() {
  $("taskForm").reset();
  editingId = null;
  $("formTitle").textContent = "Add a New Task";
  $("saveBtn").textContent = "Add Task";
  $("cancelBtn").hidden = true;
}

$("taskForm").addEventListener("submit", function(e) {
  e.preventDefault();
  const title = $("title").value.trim();
  if (!title) return;

  const data = {
    title,
    description: $("description").value.trim(),
    dueDate: $("dueDate").value,
    priority: $("priority").value
  };

  if (editingId !== null) {
    tasks = tasks.map(t => t.id === editingId ? {...t, ...data} : t);
  } else {
    tasks.unshift({
      id: Date.now().toString() + Math.random().toString(16).slice(2),
      ...data,
      completed: false
    });
  }

  resetForm();
  save();
});

$("cancelBtn").addEventListener("click", resetForm);
$("search").addEventListener("input", render);
$("filter").addEventListener("change", render);

function editTask(id) {
  const task = tasks.find(t => t.id === id);
  if (!task) return;
  editingId = id;
  $("title").value = task.title;
  $("description").value = task.description || "";
  $("dueDate").value = task.dueDate || "";
  $("priority").value = task.priority || "Normal";
  $("formTitle").textContent = "Edit Task";
  $("saveBtn").textContent = "Save Changes";
  $("cancelBtn").hidden = false;
  window.scrollTo({top: 0, behavior: "smooth"});
}

function toggleTask(id) {
  tasks = tasks.map(t => t.id === id ? {...t, completed: !t.completed} : t);
  save();
}

function deleteTask(id) {
  if (!confirm("Are you sure you want to delete this task?")) return;
  tasks = tasks.filter(t => t.id !== id);
  if (editingId === id) resetForm();
  save();
}

function render() {
  $("total").textContent = tasks.length;
  $("pending").textContent = tasks.filter(t => !t.completed).length;
  $("completed").textContent = tasks.filter(t => t.completed).length;

  const query = $("search").value.toLowerCase().trim();
  const filter = $("filter").value;

  const visible = tasks.filter(t => {
    const matches = (t.title + " " + (t.description || "")).toLowerCase().includes(query);
    const status = filter === "all" ||
      (filter === "completed" && t.completed) ||
      (filter === "pending" && !t.completed);
    return matches && status;
  });

  const list = $("taskList");
  list.replaceChildren();

  if (!visible.length) {
    const empty = document.createElement("p");
    empty.textContent = tasks.length ? "No tasks match your search." : "No tasks yet. Add your first task above!";
    list.appendChild(empty);
    return;
  }

  visible.forEach(t => {
    const card = document.createElement("article");
    card.className = "task" + (t.completed ? " done" : "");

    const heading = document.createElement("h3");
    heading.textContent = t.title;
    card.appendChild(heading);

    if (t.description) {
      const desc = document.createElement("p");
      desc.textContent = t.description;
      card.appendChild(desc);
    }

    const meta = document.createElement("small");
    meta.textContent = "Priority: " + (t.priority || "Normal") +
      (t.dueDate ? " • Due: " + t.dueDate : "") +
      (t.completed ? " • Completed" : " • Pending");
    card.appendChild(meta);

    const actions = document.createElement("div");
    actions.className = "actions";

    const statusBtn = document.createElement("button");
    statusBtn.textContent = t.completed ? "Mark Pending" : "Complete";
    statusBtn.addEventListener("click", () => toggleTask(t.id));

    const editBtn = document.createElement("button");
    editBtn.textContent = "Edit";
    editBtn.style.background = "#475569";
    editBtn.addEventListener("click", () => editTask(t.id));

    const deleteBtn = document.createElement("button");
    deleteBtn.textContent = "Delete";
    deleteBtn.className = "delete";
    deleteBtn.addEventListener("click", () => deleteTask(t.id));

    actions.append(statusBtn, editBtn, deleteBtn);
    card.appendChild(actions);
    list.appendChild(card);
  });
}

render();
</script>
</body>
  </html>
